<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bagh-e-Khizar — Launching Soon</title>
<meta name="description" content="Bagh-e-Khizar is taking root. Please check back again soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grain" aria-hidden="true"></div>
<div class="lattice" aria-hidden="true"></div>

<svg class="corner corner--tl" viewBox="0 0 200 200" aria-hidden="true">
  <path d="M0,120 C30,120 40,110 40,80 C40,50 50,40 80,40 C110,40 120,30 120,0" />
  <circle cx="120" cy="0" r="4" />
  <circle cx="0" cy="120" r="4" />
  <path d="M0,60 C15,60 20,55 20,40" />
  <path d="M60,0 C60,15 55,20 40,20" />
</svg>

<svg class="corner corner--br" viewBox="0 0 200 200" aria-hidden="true">
  <path d="M200,80 C170,80 160,90 160,120 C160,150 150,160 120,160 C90,160 80,170 80,200" />
  <circle cx="80" cy="200" r="4" />
  <circle cx="200" cy="80" r="4" />
  <path d="M200,140 C185,140 180,145 180,160" />
  <path d="M140,200 C140,185 145,180 160,180" />
</svg>

<main class="wrap">

  <div class="leaves" aria-hidden="true">
    <svg class="leaf leaf--1" viewBox="0 0 40 40"><path d="M20 2 C34 10 34 30 20 38 C6 30 6 10 20 2 Z M20 4 L20 36" /></svg>
    <svg class="leaf leaf--2" viewBox="0 0 40 40"><path d="M20 2 C34 10 34 30 20 38 C6 30 6 10 20 2 Z M20 4 L20 36" /></svg>
    <svg class="leaf leaf--3" viewBox="0 0 40 40"><path d="M20 2 C34 10 34 30 20 38 C6 30 6 10 20 2 Z M20 4 L20 36" /></svg>
  </div>

  <p class="eyebrow reveal" style="--d:0">
    <span class="eyebrow__urdu">باغِ خضر</span>
    <span class="eyebrow__rule" aria-hidden="true"></span>
    <span class="eyebrow__label">A garden, taking root</span>
  </p>

  <h1 class="title reveal" style="--d:1">
    Bagh-e-Khizar
    <svg class="title__flourish" viewBox="0 0 460 24" preserveAspectRatio="none" aria-hidden="true">
      <path d="M2 12 C 100 2, 160 22, 230 12 C 300 2, 360 22, 458 12" />
    </svg>
  </h1>

  <p class="sub reveal" style="--d:2">
    is launching soon.<br>
    Please check back again.
  </p>

  <div class="status reveal" style="--d:3">
    <span class="status__dot" aria-hidden="true"></span>
    <span>Currently tending the soil</span>
  </div>

  <footer class="foot reveal" style="--d:4">
    <span>Est. 2026</span>
    <svg class="foot__mark" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2 L12 8 L18 10 L12 12 L10 18 L8 12 L2 10 L8 8 Z" /></svg>
    <span>Bagh-e-Khizar</span>
  </footer>

</main>

<script src="script.js"></script>
</body>
</html>
